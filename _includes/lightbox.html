<dialog class="dialog lightbox" id="lightbox" data-max="2xl" aria-labelledby="lightbox-caption">
  <figure class="stack" data-gap="sm">
    <img alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>
  <footer>
    <form method="dialog" class="cluster" data-justify="end" data-gap="sm">
      <small data-lightbox-count aria-live="polite"></small>
      <button class="button" type="button" data-emphasis="medium" data-size="sm" id="lightbox-prev">Previous</button>
      <button class="button" type="button" data-emphasis="medium" data-size="sm" id="lightbox-next">Next</button>
      <button class="button" data-size="sm">Close</button>
    </form>
  </footer>
</dialog>
