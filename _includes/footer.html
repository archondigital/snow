<footer class="box" data-surface="raised">
  <div class="center">
    <div class="cluster" data-justify="between" data-gap="sm">
      <small>&copy; {{ site.time | date: '%Y' }} <a href="{{ '/' | relative_url }}">{{ site.title }}</a>.
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a> &middot;
        <a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a> &middot;
        <a href="{{ '/about/privacy/' | relative_url }}">Privacy</a></small>
      <small>
        {%- if site.github_username and site.github_username != "" %}
        <a href="https://github.com/{{ site.github_username }}">GitHub</a> &middot;
        {%- endif %}
        {%- if site.twitter_username and site.twitter_username != "" %}
        <a href="https://x.com/{{ site.twitter_username }}">@{{ site.twitter_username }}</a> &middot;
        {%- endif %}
        Built with <a href="https://jekyllrb.com/">Jekyll</a> and <a href="https://foundationcss.com/yeti/">Yeti</a></small>
    </div>
  </div>
</footer>
