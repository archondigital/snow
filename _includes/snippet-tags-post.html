{%- if page.tags.size > 0 -%}
<div>
  <ul class="widget-tags">
    <p class="meta">Posted under <i class="fa fa-tag{% if page.tags.size > 1 %}s{% endif %}"></i>:</p>
    {%- for tag_name in page.tags %}
    {%- assign tag_slug = tag_name | slugify %}
    <li><a href="{{ '/topic/' | append: tag_slug | append: '/' | relative_url }}">{{ tag_name }}</a></li>
    {%- endfor %}
  </ul>
</div>
{%- endif -%}
