{%- comment -%} Date + title list. Usage: {% include post-list.html posts=some_posts %} {%- endcomment -%}
<ul class="past no-bullet">
  {%- for post in include.posts %}
  <li>
    <div class="row collapse">
      <div class="small-3 large-2 columns"><time class="meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %b" }}:</time></div>
      <div class="small-9 large-10 columns"><a href="{{ post.url | relative_url }}">{{ post.title }}{% if post.title_secondary %} <span class="label secondary t50">{{ post.title_secondary }}</span>{% endif %}</a></div>
    </div>
  </li>
  {%- endfor %}
</ul>
