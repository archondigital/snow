{%- comment -%}
  The featured image at full width, opening the post's lightbox gallery.
  Usage: {% include gallery-feature.html %}
{%- endcomment -%}
{%- capture featured_src -%}{% include img-src.html src=page.featured_image %}{%- endcapture -%}
<figure>
  <a href="{{ featured_src }}" data-gallery="post" data-caption="{{ page.excerpt | default: page.title | strip_html | strip | escape }}">
    <img src="{{ featured_src }}" alt="{{ page.title | escape }}">
  </a>
  {%- if include.hint %}
  <figcaption>Select the image to view{% if page.gallery_content %} the gallery{% endif %}.</figcaption>
  {%- endif %}
</figure>
