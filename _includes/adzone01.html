{%- if site.adsense.client and site.adsense.client != "" and jekyll.environment == "production" -%}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense.client }}" crossorigin="anonymous"></script>
<ins class="adsbygoogle"
     style="display:inline-block;width:300px;height:250px"
     data-ad-client="{{ site.adsense.client }}"
     data-ad-slot="{{ site.adsense.slot }}"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
{%- else -%}
<img src="https://placehold.co/300x250/e7e7e7/888888?text=Ad+300x250" width="300" height="250" alt="Advertisement placeholder" loading="lazy">
{%- endif -%}
