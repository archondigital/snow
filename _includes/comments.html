{%- if page.comments -%}
<section id="discussion">
  <div class="row">
    <div class="large-4 large-push-8 columns">
      <p>{% include adzone01.html %}</p>
      <h3><small>Other Topics</small></h3>
      <ul class="widget-tags">
        {% include snippet-tags-widget.html %}
      </ul>
    </div>
    <div class="large-8 large-pull-4 columns">
      {%- if site.disqus_shortname and site.disqus_shortname != "" -%}
      <div id="disqus_thread"></div>
      <script>
        var disqus_config = function () {
          this.page.url = '{{ page.url | absolute_url }}';
          this.page.identifier = '{{ page.disqus_identifier | default: page.id }}';
        };
        (function () {
          var d = document, s = d.createElement('script');
          s.src = 'https://{{ site.disqus_shortname }}.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
        })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a></noscript>
      {%- else -%}
      <div class="panel">
        <p class="meta">Comments are disabled. Set <code>disqus_shortname</code> in <code>_config.yml</code> to enable Disqus.</p>
      </div>
      {%- endif -%}
    </div>
  </div>
</section>
{%- endif -%}
