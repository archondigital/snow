---
layout: default
---
<div class="post h-entry">
  <header class="post-header">
    <div class="row">
      <div class="large-12 columns">
        <h1 class="entry-title p-name">{% if page.title_secondary %}<small>{{ page.title_secondary }}:</small><br>{% endif %}{{ page.title }}</h1>
        {% include entry-meta.html %}
      </div>
    </div>
  </header>

  <article class="post-content entry-content e-content">
    <div class="row">
      <div class="large-8 columns">
        {{ content }}
      </div>
      <aside class="large-4 columns">
        {% include adzone01.html %}
      </aside>
    </div>
  </article>

  {% include post-footer.html %}
</div>
