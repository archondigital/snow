<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="{{ page.redirect.to | default: page.redirect }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect.to | default: page.redirect }}">
  <meta name="robots" content="noindex">
</head>
<body>
  <h1>Redirecting&hellip;</h1>
  <p><a href="{{ page.redirect.to | default: page.redirect }}">Click here if you are not redirected.</a></p>
  <script>location = "{{ page.redirect.to | default: page.redirect }}";</script>
</body>
</html>
