---
layout: default
---
<div class="post h-entry">
  <header class="post-header">
    <div class="row">
      <div class="large-12 columns">
        <h1 class="entry-title p-name">{{ page.title }}</h1>
        {% include entry-meta.html %}
      </div>
    </div>
  </header>

  <article class="post-content entry-content e-content">
    <div class="row">
      <div class="large-8 columns">
        {%- if page.video_id %}
        <div class="flex-video widescreen">
          <iframe src="https://www.youtube-nocookie.com/embed/{{ page.video_id }}?rel=0&amp;modestbranding=1"
                  title="{{ page.title | escape }}" loading="lazy"
                  allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        {%- endif %}
      </div>
      <div class="large-4 columns">
        {{ content }}
      </div>
    </div>
  </article>

  {% include post-footer.html %}
</div>
