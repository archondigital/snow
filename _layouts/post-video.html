---
layout: default
---
<article class="center h-entry">
  <div class="stack" data-gap="lg">
    <header>
      <h1 class="p-name">{{ page.title }}</h1>
      {% include entry-meta.html %}
    </header>
    <div class="sidebar" data-side="end" data-width="sm" data-gap="xl">
      <div class="frame" data-ratio="16/9">
        {%- if page.video_id %}
        <iframe src="https://www.youtube-nocookie.com/embed/{{ page.video_id }}?rel=0&amp;modestbranding=1"
                title="{{ page.title | escape }}" loading="lazy"
                allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        {%- else %}
        <p>No video set.</p>
        {%- endif %}
      </div>
      <section class="e-content">{{ content }}</section>
    </div>
  </div>
</article>

{% include post-footer.html %}
